<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentMemory · 我的记忆</title>
<style>
  :root {
    --bg: #14161b; --card: #1b1e25; --line: #2a2f38; --text: #e7e9ef;
    --muted: #8a92a3; --accent: #7aa2ff; --ok: #6ac99e; --warn: #e0a860; --danger: #e07070;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    max-width: 760px; margin: 0 auto; padding: 28px 20px 10px;
  }
  .brand { font-size: 17px; font-weight: 600; }
  .brand span { margin-left: 8px; font-size: 12px; color: var(--muted); font-weight: 400; }
  .head-right { display: flex; gap: 8px; align-items: center; }
  .bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    max-width: 760px; margin: 0 auto; padding: 6px 20px 14px;
  }
  .bar input {
    flex: 1 1 200px; background: #171a20; border: 1px solid var(--line); border-radius: 9px;
    color: var(--text); padding: 8px 11px; font: inherit;
  }
  .bar input:focus { outline: 1px solid rgba(122,162,255,.5); border-color: transparent; }
  .chips { display: inline-flex; gap: 4px; }
  .chips button {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .chips button.on { color: var(--accent); background: rgba(122,162,255,.12); }
  button.link {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 12.5px;
    cursor: pointer; padding: 2px 4px;
  }
  button.link:hover { color: var(--text); }
  button.link.danger:hover { color: var(--danger); }
  a.quiet { color: var(--muted); text-decoration: none; font-size: 12.5px; }
  a.quiet:hover { color: var(--text); }
  header, .bar, main { max-width: 660px; margin: 0 auto; }
  main { padding: 0 20px 60px; }
  .group-title { margin: 22px 0 6px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .item:last-child { border-bottom: 0; }
  .item { padding: 15px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover .content { color: #fff; }
  .head-line { display: flex; gap: 10px; align-items: flex-start; }
  .head-line .content { flex: 1; }
  .chev { color: var(--muted); font-size: 12px; line-height: 1.9; user-select: none; }
  .content { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .content.clamp {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-top: 6px; font-size: 11.5px; color: var(--muted);
  }
  .meta .tag { color: var(--muted); }
  .meta .tag.sup { color: var(--warn); }
  .meta .tag.del { color: var(--danger); }
  .more {
    display: flex; gap: 12px; margin-top: 8px; font-size: 12.5px; color: var(--muted);
  }
  .more button { color: var(--muted); }
  .more button:hover { color: var(--text); }
  .expand { margin-top: 10px; padding-left: 12px; border-left: 2px solid var(--line); }
  .hist { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  .hist div { display: flex; gap: 8px; }
  .hist b { color: var(--text); font-weight: 500; }
  .hist .old { text-decoration: line-through; color: var(--muted); }
  .edit-area { margin-top: 10px; display: grid; gap: 8px; }
  .edit-area textarea {
    width: 100%; min-height: 84px; resize: vertical; background: #171a20; color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; font: inherit;
  }
  .edit-area .row { display: flex; gap: 8px; }
  button.solid {
    background: var(--accent); color: #12141a; border: 0; border-radius: 8px;
    padding: 6px 13px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.plain {
    background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px;
    padding: 5px 12px; font: inherit; cursor: pointer;
  }
  .empty { padding: 60px 0; text-align: center; color: var(--muted); font-size: 13px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 8px);
    background: #232833; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 15px; font-size: 12.5px; opacity: 0; transition: .18s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-color: rgba(224,112,112,.5); color: var(--danger); }
</style>
</head>
<body>
<header>
  <div class="brand">我的记忆 <span id="counts"></span></div>
  <div class="head-right">
    <a class="quiet" href="/api/export" target="_blank" rel="noreferrer">导出</a>
  </div>
</header>

<div class="bar">
  <input id="search" placeholder="搜索记忆内容">
  <div class="chips" id="status">
    <button data-v="active" class="on">生效</button>
    <button data-v="deleted">已删除</button>
    <button data-v="all">全部</button>
  </div>
</div>

<main id="list"><div class="empty">加载中…</div></main>
<div class="toast" id="toast"></div>

<script>
const KIND = { profile: '背景', preference: '偏好', fact: '事实', decision: '决策', lesson: '经验', episode: '事件' }
const OP = { create: '创建', update: '修改', supersede: '替换', merge: '合并', expire: '过期', delete: '删除', restore: '恢复', rollback: '回滚' }
const STATUS = { active: '生效', superseded: '已替换', deleted: '已删除' }

const state = { status: 'active', q: '', rows: [], open: new Set(), editing: null, history: {}, chain: {} }

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const time = (ts) => ts ? new Date(ts).toLocaleString('zh-CN', { hour12: false }) : '—'
const $ = (id) => document.getElementById(id)

function toast(message, error = false) {
  const el = $('toast')
  el.textContent = message
  el.className = `toast show${error ? ' err' : ''}`
  clearTimeout(toast.timer)
  toast.timer = setTimeout(() => { el.className = 'toast' }, 2200)
}

async function api(path, options) {
  const res = await fetch(path, options)
  const data = await res.json()
  if (!res.ok || data.ok === false) throw new Error(data.error ?? `HTTP ${res.status}`)
  return data
}

async function load() {
  try {
    const [{ state: overview }, { rows }] = await Promise.all([
      api('/api/state'),
      api(`/api/list?status=${state.status}`),
    ])
    const c = overview.counts
    $('counts').textContent = `${c.total} 条 · 全局 ${c.global} / 项目 ${c.project}`
    const keyword = state.q.trim().toLowerCase()
    state.rows = rows
      .filter((row) => keyword.length === 0 || [row.content, row.topic_key].some((f) => String(f ?? '').toLowerCase().includes(keyword)))
      .sort((a, b) => b.updated_at - a.updated_at)
    render()
  } catch (error) {
    $('list').innerHTML = `<div class="empty">加载失败：${esc(error.message)}</div>`
  }
}

function render() {
  if (state.rows.length === 0) {
    $('list').innerHTML = `<div class="empty">${state.status === 'deleted' ? '没有已删除的记忆' : '还没有记忆。跟 AI 聊过之后，值得长期保留的内容会自动出现在这里。'}</div>`
    return
  }
  const groups = [
    { key: 'global', title: '关于我', rows: state.rows.filter((row) => row.scope === 'global') },
    { key: 'project', title: '本项目', rows: state.rows.filter((row) => row.scope === 'project') },
  ].filter((group) => group.rows.length > 0)

  $('list').innerHTML = groups.map((group) => `
    <div class="group-title">${group.title} · ${group.rows.length}</div>
    ${group.rows.map(rowHtml).join('')}`).join('')

  for (const el of document.querySelectorAll('[data-act]')) {
    el.addEventListener('click', () => act(el.dataset.act, el.dataset.id))
  }
}

function rowHtml(row) {
  const open = state.open.has(row.id)
  const editing = state.editing === row.id
  const history = state.history[row.id]
  const chain = state.chain[row.id]
  const older = (chain ?? []).filter((item) => item.id !== row.id)
  const canDelete = row.status === 'active'
  return `
    <div class="item" data-act="toggle" data-id="${esc(row.id)}">
      <div class="head-line">
        <div class="content${open ? '' : ' clamp'}">${esc(row.content)}</div>
        <span class="chev">${open ? '收起' : '展开'}</span>
      </div>
      <div class="meta">
        <span class="tag">${KIND[row.kind] ?? row.kind}</span>
        <span>·</span><span>${time(row.updated_at)}</span>
        ${row.status !== 'active' ? `<span class="tag ${row.status === 'deleted' ? 'del' : 'sup'}">· ${STATUS[row.status]}</span>` : ''}
        ${row.topic_key ? `<span>· ${esc(row.topic_key)}</span>` : ''}
      </div>
      ${editing ? `
        <div class="edit-area">
          <textarea id="edit-${esc(row.id)}">${esc(row.content)}</textarea>
          <div class="row">
            <button class="solid" data-act="save" data-id="${esc(row.id)}">保存</button>
            <button class="plain" data-act="cancel" data-id="${esc(row.id)}">取消</button>
          </div>
        </div>` : ''}
      ${open && older.length > 0 ? `
        <div class="expand">
          <div class="group-title" style="margin:0 0 4px">以前的值</div>
          <div class="hist">${older.map((item) => `
            <div><span class="old">${esc(item.content)}</span><span>${time(item.created_at)}</span></div>`).join('')}</div>
        </div>` : ''}
      ${open && history?.length > 1 ? `
        <div class="expand">
          <div class="group-title" style="margin:0 0 4px">变更记录</div>
          <div class="hist">${history.map((item) => `
            <div><b>${OP[item.op] ?? item.op}</b><span>${time(item.created_at)}</span></div>`).join('')}</div>
        </div>` : ''}
      ${open ? `
        <div class="more">
          ${row.status === 'deleted' ? `<button class="link" data-act="restore" data-id="${esc(row.id)}">恢复</button>` : ''}
          ${canDelete ? `<button class="link" data-act="edit" data-id="${esc(row.id)}">编辑</button>` : ''}
          ${canDelete ? `<button class="link danger" data-act="forget" data-id="${esc(row.id)}">删除</button>` : ''}
        </div>` : ''}
    </div>`
}

async function act(action, id) {
  const row = state.rows.find((item) => item.id === id)
  try {
    if (action === 'toggle') {
      if (state.open.has(id)) state.open.delete(id)
      else {
        state.open.add(id)
        if (!state.history[id]) {
          const [versions, chainReply] = await Promise.all([
            api(`/api/history?id=${encodeURIComponent(id)}`),
            row?.topic_key
              ? api(`/api/chain?topic=${encodeURIComponent(row.topic_key)}&scope=${encodeURIComponent(row.scope)}`)
              : Promise.resolve({ chain: [] }),
          ])
          state.history[id] = versions.versions ?? []
          state.chain[id] = chainReply.chain ?? []
        }
      }
      render()
      return
    }
    if (action === 'edit') {
      state.editing = id
      state.open.add(id)
      render()
      document.getElementById(`edit-${id}`)?.focus()
      return
    }
    if (action === 'cancel') { state.editing = null; render(); return }
    if (action === 'save') {
      const content = document.getElementById(`edit-${id}`).value.trim()
      if (content.length < 4) { toast('内容太短', true); return }
      await api('/api/update', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id, content }),
      })
      state.editing = null
      toast('已保存')
      await load()
      return
    }
    if (action === 'forget') {
      if (!confirm('删除这条记忆？可以在「已删除」里恢复。')) return
      await api('/api/forget', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id }),
      })
      toast('已删除，可恢复')
      await load()
      return
    }
    if (action === 'restore') {
      await api('/api/restore', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id }),
      })
      toast('已恢复')
      await load()
      return
    }
  } catch (error) {
    toast(error.message, true)
  }
}

$('search').addEventListener('input', (event) => { state.q = event.target.value; load() })
$('status').addEventListener('click', (event) => {
  const button = event.target.closest('button')
  if (!button) return
  for (const item of $('status').querySelectorAll('button')) item.classList.toggle('on', item === button)
  state.status = button.dataset.v
  state.open.clear()
  state.history = {}
  state.editing = null
  load()
})

load()
</script>
</body>
</html>
