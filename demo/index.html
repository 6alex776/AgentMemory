<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentMemory · 记忆面板</title>
<style>
  :root {
    --bg: #14161b; --card: #1b1e25; --line: #2a2f38; --text: #e7e9ef;
    --muted: #8a92a3; --accent: #7aa2ff; --ok: #6ac99e; --warn: #e0a860; --danger: #e07070;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 16px; font-weight: 600; }
  .brand .db { margin-left: 10px; font: 11.5px ui-monospace, Consolas, monospace; color: var(--muted); }
  .head-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .counts { color: var(--muted); font-size: 12px; }
  button, select, input, textarea { font: inherit; color: var(--text); }
  button {
    background: var(--accent); color: #12141a; border: 0; border-radius: 8px;
    padding: 6px 13px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 500; }
  button.ghost:hover { border-color: #3a4150; }
  button.danger { background: transparent; border: 1px solid rgba(224,112,112,.45); color: var(--danger); font-weight: 500; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  a.link { color: var(--text); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; font-size: 13px; }
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 22px; border-bottom: 1px solid var(--line);
  }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    background: transparent; color: var(--muted); border-radius: 0; font-weight: 500; padding: 5px 12px; font-size: 12.5px;
  }
  .seg button.on { background: rgba(122,162,255,.14); color: var(--accent); }
  .search { flex: 1 1 220px; min-width: 180px; }
  input, select, textarea {
    background: #14171d; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid rgba(122,162,255,.55); border-color: transparent; }
  main {
    display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .95fr);
    gap: 18px; padding: 18px 22px 40px; max-width: 1400px; margin: 0 auto; align-items: start;
  }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted);
  }
  .list { max-height: calc(100vh - 210px); overflow: auto; }
  .item {
    padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: 5px;
  }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: #1f232b; }
  .item.on { background: rgba(122,162,255,.09); box-shadow: inset 2px 0 0 var(--accent); }
  .item .text { font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .item .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .badge.active { color: var(--ok); border-color: rgba(106,201,158,.4); background: rgba(106,201,158,.08); }
  .badge.superseded { color: var(--warn); border-color: rgba(224,168,96,.4); background: rgba(224,168,96,.08); }
  .badge.deleted { color: var(--danger); border-color: rgba(224,112,112,.4); background: rgba(224,112,112,.08); }
  .badge.pinned { color: var(--accent); border-color: rgba(122,162,255,.4); }
  .detail { padding: 14px; display: grid; gap: 12px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 12.5px; }
  .field { display: grid; gap: 5px; }
  .field label { font-size: 11.5px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  code { font: 11.5px ui-monospace, Consolas, monospace; background: #1a1d24; padding: 1px 5px; border-radius: 4px; }
  .history { display: grid; gap: 6px; max-height: 200px; overflow: auto; }
  .hist-row { display: grid; gap: 2px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
  .hist-row:last-child { border-bottom: 0; }
  .hist-row .t { color: var(--muted); font-size: 11px; }
  .chain-old { color: var(--muted); text-decoration: line-through; }
  .blk { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 8px; }
  .blk-head {
    display: flex; justify-content: space-between; padding: 6px 10px; font-size: 11.5px; color: var(--muted);
    background: #191c23; border-bottom: 1px solid var(--line);
  }
  .blk pre { margin: 0; padding: 9px 10px; white-space: pre-wrap; word-break: break-word;
    font: 12px/1.6 ui-monospace, Consolas, monospace; color: #d5d9e3; }
  .blk pre.empty { color: #5b6270; font-style: italic; }
  dialog {
    background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; width: min(520px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h3 { margin: 0 0 12px; font-size: 15px; }
  .toast {
    position: fixed; right: 20px; bottom: 20px; background: #232833; border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px; font-size: 12.5px; opacity: 0; transform: translateY(8px);
    transition: .18s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.err { border-color: rgba(224,112,112,.5); color: var(--danger); }
</style>
</head>
<body>
<header>
  <div class="brand">AgentMemory <span class="db" id="dbPath"></span></div>
  <div class="head-right">
    <span class="counts" id="counts"></span>
    <button class="ghost" id="btnAdd">新建记忆</button>
    <a class="link" href="/api/export" target="_blank" rel="noreferrer">导出 Markdown</a>
  </div>
</header>

<div class="toolbar">
  <input class="search" id="search" placeholder="搜索内容、槽位或 id…">
  <div class="seg" id="scopeSeg">
    <button data-v="" class="on">全部</button>
    <button data-v="global">全局</button>
    <button data-v="project">项目</button>
  </div>
  <div class="seg" id="statusSeg">
    <button data-v="active" class="on">生效</button>
    <button data-v="deleted">已删除</button>
    <button data-v="superseded">已替换</button>
    <button data-v="all">全部</button>
  </div>
  <select id="kind" style="width:auto">
    <option value="">全部类型</option>
    <option value="profile">背景</option>
    <option value="preference">偏好</option>
    <option value="fact">事实</option>
    <option value="decision">决策</option>
    <option value="lesson">经验</option>
    <option value="episode">事件</option>
  </select>
</div>

<main>
  <section class="panel">
    <div class="panel-head"><span id="listTitle">记忆</span><span id="listCount"></span></div>
    <div class="list" id="list"></div>
  </section>

  <section style="display:grid;gap:18px">
    <div class="panel">
      <div class="panel-head"><span>详情</span><span id="detailMeta"></span></div>
      <div id="detail"><div class="empty">从左边选一条记忆</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><span>注入预览</span><span class="small">按问题检索，三段合计字符数</span></div>
      <div style="padding:12px">
        <div class="row">
          <input id="q" placeholder="输入一个问题，看这一轮会注入什么" style="flex:1">
          <button class="ghost" id="btnInject">预览</button>
        </div>
        <div id="injectOut"></div>
      </div>
    </div>
  </section>
</main>

<dialog id="addDialog">
  <h3>新建记忆</h3>
  <div style="display:grid;gap:10px">
    <div class="grid2">
      <div class="field"><label>范围</label>
        <select id="fScope"><option value="global">全局</option><option value="project" selected>项目</option></select>
      </div>
      <div class="field"><label>类型</label>
        <select id="fKind">
          <option value="decision">决策</option><option value="fact">事实</option>
          <option value="preference">偏好</option><option value="profile">背景</option>
          <option value="lesson">经验</option><option value="episode">事件</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label>槽位（可选，同槽位会替换旧值）</label><input id="fTopic" placeholder="tech.datastore"></div>
      <div class="field"><label>重要度</label>
        <select id="fImportance"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
      </div>
    </div>
    <div class="field"><label>内容</label><textarea id="fContent" rows="3" placeholder="一句自包含的话"></textarea></div>
    <div class="row" style="justify-content:flex-end">
      <button class="ghost" id="addCancel">取消</button>
      <button id="addSave">保存</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const KIND_LABEL = { profile: '背景', preference: '偏好', fact: '事实', decision: '决策', lesson: '经验', episode: '事件' }
const OP_LABEL = { create: '创建', update: '修改', supersede: '替换', merge: '合并', expire: '过期', delete: '删除', restore: '恢复', rollback: '回滚' }
const STATUS_LABEL = { active: '生效', superseded: '已替换', deleted: '已删除' }

const filters = { scope: '', status: 'active', kind: '', q: '' }
const view = { rows: [], selected: null, history: [], chain: [] }

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const time = (ts) => ts ? new Date(ts).toLocaleString('zh-CN', { hour12: false }) : '—'
const $ = (id) => document.getElementById(id)

function toast(message, isError = false) {
  const el = $('toast')
  el.textContent = message
  el.className = `toast show${isError ? ' err' : ''}`
  clearTimeout(toast.timer)
  toast.timer = setTimeout(() => { el.className = 'toast' }, 2400)
}

async function api(path, options) {
  const res = await fetch(path, options)
  const data = await res.json()
  if (!res.ok || data.ok === false) throw new Error(data.error ?? `HTTP ${res.status}`)
  return data
}

async function loadCounts() {
  try {
    const { state } = await api('/api/state')
    const c = state.counts
    $('counts').textContent = `生效 ${c.total} · 全局 ${c.global} / 项目 ${c.project} · 已替换 ${c.superseded}`
  } catch { /* 计数失败不影响列表 */ }
}

async function loadList() {
  const params = new URLSearchParams()
  params.set('status', filters.status)
  if (filters.scope) params.set('scope', filters.scope)
  const { rows } = await api(`/api/list?${params.toString()}`)
  const keyword = filters.q.trim().toLowerCase()
  view.rows = rows
    .filter((row) => (filters.kind ? row.kind === filters.kind : true))
    .filter((row) => keyword.length === 0 || [
      row.content, row.abstract, row.topic_key, row.id, KIND_LABEL[row.kind],
    ].some((field) => String(field ?? '').toLowerCase().includes(keyword)))
    .sort((a, b) => b.importance - a.importance || b.updated_at - a.updated_at)
  renderList()
}

function renderList() {
  const list = $('list')
  $('listCount').textContent = `${view.rows.length} 条`
  if (view.rows.length === 0) {
    list.innerHTML = '<div class="empty">没有符合条件的记忆</div>'
    return
  }
  list.innerHTML = view.rows.map((row) => `
    <div class="item${view.selected === row.id ? ' on' : ''}" data-id="${esc(row.id)}">
      <div class="text">${esc(row.content)}</div>
      <div class="meta">
        <span class="badge ${row.status}">${STATUS_LABEL[row.status] ?? row.status}</span>
        <span class="badge">${KIND_LABEL[row.kind] ?? row.kind}</span>
        <span>${row.scope === 'global' ? '全局' : '项目'}</span>
        <span>重要度 ${row.importance}</span>
        ${row.pinned ? '<span class="badge pinned">已固定</span>' : ''}
        <span>${time(row.updated_at)}</span>
        ${row.topic_key ? `<code>${esc(row.topic_key)}</code>` : ''}
      </div>
    </div>`).join('')

  for (const el of list.querySelectorAll('.item')) {
    el.addEventListener('click', () => select(el.dataset.id))
  }
}

async function select(id) {
  view.selected = id
  renderList()
  const row = view.rows.find((item) => item.id === id)
  view.history = []
  view.chain = []
  try {
    const [detail, history, chain] = await Promise.all([
      api(`/api/get?id=${encodeURIComponent(id)}`),
      api(`/api/history?id=${encodeURIComponent(id)}`),
      row?.topic_key
        ? api(`/api/chain?topic=${encodeURIComponent(row.topic_key)}&scope=${encodeURIComponent(row.scope)}`)
        : Promise.resolve({ chain: [] }),
    ])
    view.history = history.versions ?? []
    view.chain = chain.chain ?? []
    renderDetail(detail.row)
  } catch (error) {
    toast(error.message, true)
  }
}

function renderDetail(row) {
  const active = row.status === 'active'
  $('detailMeta').innerHTML = `<code>${esc(row.id)}</code>`
  $('detail').innerHTML = `
    <div class="detail">
      <div class="row">
        <span class="badge ${row.status}">${STATUS_LABEL[row.status] ?? row.status}</span>
        <span class="badge">${KIND_LABEL[row.kind] ?? row.kind}</span>
        <span class="small muted">${row.scope === 'global' ? '全局' : '项目'} · 创建 ${time(row.created_at)} · 更新 ${time(row.updated_at)}</span>
      </div>
      <div class="field">
        <label>内容</label>
        <textarea id="dContent" rows="4"${active ? '' : ' disabled'}>${esc(row.content)}</textarea>
      </div>
      <div class="grid2">
        <div class="field"><label>类型</label>
          <select id="dKind"${active ? '' : ' disabled'}>
            ${Object.entries(KIND_LABEL).map(([value, label]) =>
              `<option value="${value}"${row.kind === value ? ' selected' : ''}>${label}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>重要度</label>
          <select id="dImportance"${active ? '' : ' disabled'}>
            ${[1, 2, 3, 4, 5].map((value) =>
              `<option${row.importance === value ? ' selected' : ''}>${value}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="row">
        <span class="small muted">${row.topic_key ? `槽位 <code>${esc(row.topic_key)}</code>` : '无槽位（普通事实，靠内容去重）'}</span>
      </div>
      <div class="row">
        ${active ? '<button id="dSave">保存修改</button><button class="danger" id="dDelete">删除</button>' : ''}
        ${row.status === 'deleted' ? '<button id="dRestore">恢复</button>' : ''}
      </div>
      ${view.chain.length > 1 ? `
        <div class="field"><label>版本链（旧 → 新）</label>
          ${view.chain.map((item) => `
            <div class="hist-row">
              <div class="${item.status === 'active' ? '' : 'chain-old'}">${esc(item.content)}</div>
              <div class="t">${time(item.created_at)} · ${STATUS_LABEL[item.status] ?? item.status}</div>
            </div>`).join('')}
        </div>` : ''}
      <div class="field"><label>变更历史（${view.history.length} 条）</label>
        <div class="history">
          ${view.history.length === 0 ? '<span class="small muted">没有版本记录</span>' : view.history.map((item) => `
            <div class="hist-row">
              <div>${OP_LABEL[item.op] ?? item.op} <span class="muted">by ${esc(item.actor ?? '—')}</span></div>
              <div class="t">${time(item.created_at)}${item.reason ? ` · ${esc(item.reason)}` : ''}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>`

  if (active) {
    $('dSave').addEventListener('click', async () => {
      try {
        await api('/api/update', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            id: row.id,
            content: $('dContent').value,
            kind: $('dKind').value,
            importance: Number($('dImportance').value),
          }),
        })
        toast('已保存')
        await refresh()
        await select(row.id)
      } catch (error) { toast(error.message, true) }
    })
    $('dDelete').addEventListener('click', async () => {
      if (!confirm('删除这条记忆？删除是软删除，之后可以在「已删除」里恢复。')) return
      try {
        await api('/api/forget', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ id: row.id }),
        })
        toast('已删除（可恢复）')
        view.selected = null
        $('detail').innerHTML = '<div class="empty">从左边选一条记忆</div>'
        await refresh()
      } catch (error) { toast(error.message, true) }
    })
  }
  if (row.status === 'deleted') {
    $('dRestore').addEventListener('click', async () => {
      try {
        await api('/api/restore', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ id: row.id }),
        })
        toast('已恢复')
        await refresh()
        await select(row.id)
      } catch (error) { toast(error.message, true) }
    })
  }
}

function segHandler(elementId, key) {
  const seg = $(elementId)
  seg.addEventListener('click', (event) => {
    const button = event.target.closest('button')
    if (!button) return
    for (const item of seg.querySelectorAll('button')) item.classList.toggle('on', item === button)
    filters[key] = button.dataset.v
    loadList().catch((error) => toast(error.message, true))
  })
}

$('search').addEventListener('input', (event) => {
  filters.q = event.target.value
  renderList()
})
$('kind').addEventListener('change', (event) => {
  filters.kind = event.target.value
  renderList()
})
segHandler('scopeSeg', 'scope')
segHandler('statusSeg', 'status')

$('btnInject').addEventListener('click', async () => {
  const question = $('q').value.trim()
  const out = $('injectOut')
  out.innerHTML = '<p class="small muted">查询中…</p>'
  try {
    const { inject } = await api(`/api/inject?q=${encodeURIComponent(question)}`)
    const block = (title, part) => `
      <div class="blk">
        <div class="blk-head"><span>${title}</span><span>${part?.chars ?? 0} 字符</span></div>
        <pre class="${part?.text ? '' : 'empty'}">${part?.text ? esc(part.text) : '（这一块为空）'}</pre>
      </div>`
    out.innerHTML = `<p class="small muted" style="margin:8px 0 0">合计 ${inject.chars} 字符</p>`
      + block('身份块（全局，会话内冻结）', inject.identity)
      + block('项目块（每轮重建）', inject.project)
      + block('检索块（按问题，已去重）', inject.retrieval)
  } catch (error) {
    out.innerHTML = `<p class="small muted">出错：${esc(error.message)}</p>`
  }
})
$('q').addEventListener('keydown', (event) => { if (event.key === 'Enter') $('btnInject').click() })

$('btnAdd').addEventListener('click', () => $('addDialog').showModal())
$('addCancel').addEventListener('click', () => $('addDialog').close())
$('addSave').addEventListener('click', async () => {
  const content = $('fContent').value.trim()
  if (content.length < 4) { toast('内容至少 4 个字', true); return }
  try {
    const { result } = await api('/api/save', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        scope: $('fScope').value,
        kind: $('fKind').value,
        topicKey: $('fTopic').value.trim() || undefined,
        importance: Number($('fImportance').value),
        content,
      }),
    })
    $('addDialog').close()
    $('fContent').value = ''
    $('fTopic').value = ''
    toast(result.status === 'superseded' ? `已替换旧值（新 id ${result.id}）`
      : result.status === 'duplicate' ? '内容重复，未写入'
      : result.status === 'tombstoned' ? '这个槽位曾删除过，未自动复活'
      : '已新增')
    await refresh()
  } catch (error) { toast(error.message, true) }
})

async function refresh() {
  await Promise.all([loadCounts(), loadList()])
}

async function boot() {
  try {
    const health = await api('/api/health')
    $('dbPath').textContent = health.file
  } catch { /* 健康检查失败时仍然尝试列表 */ }
  await refresh()
}
boot()
</script>
</body>
</html>
